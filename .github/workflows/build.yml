name: Build and publish artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libssl-dev \
            libbz2-dev libreadline-dev libsqlite3-dev libffi-dev liblzma-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            postprocess/target
          key: cargo-${{ runner.os }}-${{ hashFiles('postprocess/Cargo.lock') }}

      - name: Build cpython and postprocess
        run: make build

      - name: Stage release archive
        run: |
          mkdir -p dist/d3g-python-latest/bin dist/d3g-python-latest/configs
          cp -r build/. dist/d3g-python-latest/
          cp -r configs/. dist/d3g-python-latest/configs/
          tar -C dist -czf d3g-python-latest.tar.gz d3g-python-latest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: d3g-build-${{ runner.os }}
          path: d3g-python-latest.tar.gz

      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: d3g-python-latest.tar.gz

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: d3g-python-latest
          name: d3g-python-latest
          prerelease: true
          make_latest: false
          files: d3g-python-latest.tar.gz
