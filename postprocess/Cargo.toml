[package]
name = "d3g-postprocess"
version = "0.1.0"
edition = "2021"
description = "Offline merge and dataflow-graph construction for D3G traces"

[[bin]]
name = "d3g-postprocess"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
indexmap = "2"

[profile.release]
debug = 1
