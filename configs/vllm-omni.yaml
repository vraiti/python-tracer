# Trace only the vllm and vllm_omni packages.
#
#   PYTHON_TRACER_CONFIG=configs/vllm-omni.yaml PYTHON_TRACER_OUTDIR=traces/vllm-omni \
#     python -m d3g -- $(which vllm) serve tiny-random/Qwen-Image --omni --port 8000 --enforce-eager
#
# Calls whose code lives under either package are traced, and instances of
# classes whose __init__ is defined there receive object-level tracking.
modules:
  - vllm
  - vllm_omni
